spring.application.name=babyshophub


# Database Connection URL (change 'mydb' to your database name)
spring.datasource.url=jdbc:mysql://localhost:3306/babyshophub_db

# Database Credentials
spring.datasource.username=root
spring.datasource.password=root

# JDBC Driver (Spring Boot usually detects this automatically)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL Auto (creates/updates tables automatically based on Java entities)
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL queries in the console (great for debugging)
spring.jpa.show-sql=true
